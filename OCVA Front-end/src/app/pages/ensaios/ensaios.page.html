<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <div class="toolbar-brand">
      <a class="toolbar-logo-link" routerLink="/inicio" aria-label="Voltar para o início">
        <img class="toolbar-logo" src="/assets/icon/ocva-header.png" alt="OCVA - Orquestra de Câmara do Vale do Aço">
      </a>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ensaios-page">
  <ion-list *ngIf="ensaios && ensaios.length > 0">
    <ion-item *ngFor="let ensaio of ensaios; let i = index">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{ensaio.data}}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <div><strong>Descrição:</strong> {{ensaio.descricao}}</div>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>

  <div *ngIf="!ensaios || ensaios.length === 0" style="padding:16px">Nenhum ensaio encontrado.</div>
</ion-content>
