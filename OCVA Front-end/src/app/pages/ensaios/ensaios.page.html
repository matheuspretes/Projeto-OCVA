<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <a class="toolbar-logo-link" routerLink="/inicio" aria-label="Voltar para o início">
      <img class="toolbar-logo" src="/assets/icon/ocva-header.png" alt="OCVA - Orquestra de Câmara do Vale do Aço">
    </a>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <div *ngIf="!ensaios || ensaios.length === 0" style="text-align: center; margin-top: 50px; color: #aaa;">
    <p>Nenhum ensaio agendado encontrado.</p>
  </div>

  <ion-card *ngFor="let ensaio of ensaios" style="margin-bottom: 20px;">
    <ion-card-header>
      <ion-card-title style="font-weight: bold; color: #ffffff;">
        {{ ensaio.titulo || 'Ensaio Geral' }}
      </ion-card-title>
      <ion-card-subtitle style="color: #bbb;">
        Data: {{ ensaio.data }}
      </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      <p style="font-size: 1.1em; margin-bottom: 15px; color: #ddd;">
        <strong>Descrição:</strong> {{ ensaio.descricao }}
      </p>

      <hr style="border-top: 1px solid #444; margin: 15px 0;" />

      <div class="musicos-section">
        <h6 style="margin-bottom: 10px; font-weight: bold; color: #deb887; font-size: 1em;">
          Músicos presentes:
        </h6>

        <p *ngIf="!ensaio.nomesMusicos || ensaio.nomesMusicos.length === 0"
          style="font-style: italic; color: #888; margin: 5px 0;">
          Nenhum músico escalado para este ensaio.
        </p>

        <div style="display: flex; flex-wrap: wrap; gap: 4px;">
          <ion-chip *ngFor="let nome of ensaio.nomesMusicos" color="primary">
            <ion-label style="font-weight: 500;">{{ nome }}</ion-label>
          </ion-chip>
        </div>

        <div *ngIf="podeEditarOuExcluir()" style="display:flex; gap:8px; margin-top:16px; flex-wrap: wrap;">
          <ion-button size="small" fill="outline" (click)="editarEnsaio(ensaio)">Editar</ion-button>
          <ion-button size="small" color="danger" fill="outline" (click)="excluirEnsaio(ensaio)">Excluir</ion-button>
          <ion-button size="small" color="success" fill="solid" (click)="confirmarPresenca(ensaio)">Confirmar presença</ion-button>
        </div>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
