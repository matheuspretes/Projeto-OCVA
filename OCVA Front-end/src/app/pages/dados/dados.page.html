<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/inicio"></ion-back-button>
    </ion-buttons>
    <ion-title>Dados do Usuário</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="dados-page">
  <div class="background-orb orb-one"></div>
  <div class="background-orb orb-two"></div>

  <div class="dados-shell">
    <ion-card class="dados-card surface-card">
      <ion-card-header>
        <ion-card-title>Informações pessoais</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="formGroup" (ngSubmit)="salvar()">
          <div class="form-group">
            <p class="form-group-title">Identidade</p>

            <ion-item class="field info-field">
              <ion-label position="stacked">Nome</ion-label>
              <ion-input type="text" formControlName="nome"></ion-input>
            </ion-item>

            <ion-item class="field info-field">
              <ion-label position="stacked">Login</ion-label>
              <ion-input type="text" formControlName="login"></ion-input>
            </ion-item>
          </div>

          <div class="form-group">
            <p class="form-group-title">Segurança</p>

            <ion-item class="field info-field">
              <ion-label position="stacked">Senha</ion-label>
              <ion-input type="password" formControlName="senha"></ion-input>
            </ion-item>
          </div>

          <div class="form-group">
            <p class="form-group-title">Perfil</p>

            <ion-item class="field">
              <ion-label position="stacked">Selecionar tipo</ion-label>
              <ion-select formControlName="tipo" placeholder="Escolha uma opção">
                <ion-select-option value="musico">Musico</ion-select-option>
                <ion-select-option value="maestro">Maestro</ion-select-option>
                <ion-select-option value="diretoria">Diretoria</ion-select-option>
                <ion-select-option value="secretaria">Secretaria</ion-select-option>
              </ion-select>
            </ion-item>

            <ion-item *ngIf="formGroup.get('tipo')?.value === 'musico'" class="field info-field">
              <ion-label position="stacked">Instrumento</ion-label>
              <ion-input type="text" formControlName="instrumento"></ion-input>
            </ion-item>
          </div>

          <div class="button-group">
            <ion-button type="submit" expand="block" color="primary" [disabled]="!formGroup.valid">
              SALVAR
            </ion-button>
            <ion-button expand="block" color="danger" (click)="excluir()">
              EXCLUIR
            </ion-button>
            <ion-button type="button" expand="block" color="danger" (click)="cancelar()">
              Cancelar
            </ion-button>
            <ion-button type="button" expand="block" color="medium" (click)="sairDaConta()">
              Sair da conta
            </ion-button>
          </div>

        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
