<ion-header>
  <ion-toolbar>
    <div class="toolbar-brand">
      <a class="toolbar-logo-link" routerLink="/inicio" aria-label="Voltar para o início">
        <img class="toolbar-logo" src="/assets/icon/ocva-header.png" alt="OCVA - Orquestra de Câmara do Vale do Aço">
      </a>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ensaios-page">
  <ion-list *ngIf="eventos && eventos.length > 0">
    <ion-item *ngFor="let evento of eventos; let i = index">
      <ion-card>
        <ion-card-header>
          <ion-card-title>{{evento.data}}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <div><strong>Descrição:</strong> {{evento.descricao}}</div>
          <div *ngIf="podeEditarOuExcluir()" style="display:flex; gap:8px; margin-top:12px; flex-wrap: wrap;">
            <ion-button size="small" fill="outline" (click)="editarEvento(evento)">Editar</ion-button>
            <ion-button size="small" color="danger" fill="outline" (click)="excluirEvento(evento)">Excluir</ion-button>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>

  <div *ngIf="!eventos || eventos.length === 0" style="padding:16px">Nenhum evento encontrado.</div>
</ion-content>
