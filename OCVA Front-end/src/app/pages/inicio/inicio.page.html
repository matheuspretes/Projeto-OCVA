<ion-header>
  <ion-toolbar>
    <div class="toolbar-brand" *ngIf="usuarioAutenticado" *ngFor="let card of nomes">
      <a class="toolbar-logo-link" routerLink="/inicio" aria-label="Ir para o início">
        <img class="toolbar-logo" src="/assets/icon/ocva-header.png" alt="OCVA - Orquestra de Câmara do Vale do Aço">
      </a>
      <a *ngIf="card.kind === Nome">
        <span class="user-greeting">
          Olá, {{ usuarioAutenticado }}
        </span>
      </a>
    </div>
    <ion-buttons slot="end">
      <ion-button routerLink="/dados">
        <ion-icon name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="inicio-page">
  <div class="inicio-shell">
    <div class="dashboard-grid">
      <ion-card class="dashboard-card surface-card">
        <ion-card-header>
          <ion-card-title>Ações rápidas</ion-card-title>
        </ion-card-header>

        <ion-card-content>
          <ng-container *ngIf="visibleCards.length > 0; else emptyState">
            <div class="action-list">
              <ng-container *ngFor="let card of visibleCards">
                <a *ngIf="card.kind === 'link'" [routerLink]="card.route" class="action-link primary-link">
                  <span class="action-text">
                    <strong>{{ card.title }}</strong>
                    <small>{{ card.description }}</small>
                  </span>
                </a>

                <button *ngIf="card.kind === 'button'" type="button" class="action-link danger-link" (click)="sair()">
                  <span class="action-text">
                    <strong>{{ card.title }}</strong>
                    <small>{{ card.description }}</small>
                  </span>
                </button>
              </ng-container>
            </div>
          </ng-container>

          <ng-template #emptyState>
            <p class="empty-state">Nenhuma ação disponível para este perfil.</p>
          </ng-template>
        </ion-card-content>
      </ion-card>
    </div>
  </div>
</ion-content>
