<ion-header class="custom-header">
  <ion-toolbar>
    <div class="header-inner">
      <div class="header-left">
        <ion-icon name="book-outline" class="title-icon"></ion-icon>
        <span class="header-title">{{ modoEdicao ? 'Editar ensaio' : 'Novo ensaio' }}</span>
      </div>
      <button type="button" class="btn-voltar" routerLink="/ensaios">
        <ion-icon name="arrow-back-outline"></ion-icon>
        <span>Voltar aos ensaios</span>
      </button>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="criar-ensaio-content">
  <div class="form-container">
    <div class="card-form">
      <div class="card-header-custom">
        <div class="titulo-destaque">
          <ion-icon name="musical-notes-outline"></ion-icon>
          <h2>Dados do ensaio</h2>
        </div>
        <p class="subtitulo">Informe a data, o horário e quem participará.</p>
      </div>

      <form [formGroup]="formGroup" (ngSubmit)="salvar()">
        <!-- Título -->
        <div class="campo-grupo">
          <label>Título</label>
          <input 
            type="text" 
            class="input-dark" 
            placeholder="Ex.: Ensaio Geral" 
            formControlName="titulo" 
          />
          <span *ngIf="isInvalid('titulo')" class="msg-erro">Preencha o título do ensaio.</span>
        </div>

        <!-- Data e Horário -->
        <div class="linha-dupla">
          <div class="campo-grupo">
            <label>Data</label>
            <input 
              type="date" 
              class="input-dark" 
              formControlName="data" 
            />
            <span *ngIf="isInvalid('data')" class="msg-erro">Preencha a data.</span>
          </div>

          <div class="campo-grupo">
            <label>Horário</label>
            <input 
              type="time" 
              class="input-dark" 
              formControlName="horario" 
            />
            <span *ngIf="isInvalid('horario')" class="msg-erro">Preencha o horário.</span>
          </div>
        </div>

        <!-- Descrição -->
        <div class="campo-grupo">
          <label>Descrição</label>
          <textarea 
            rows="4" 
            class="input-dark textarea-dark" 
            placeholder="Repertório, orientações e observações." 
            formControlName="descricao"
          ></textarea>
          <span *ngIf="isInvalid('descricao')" class="msg-erro">Preencha a descrição do ensaio.</span>
        </div>

        <!-- Músicos Escalados -->
        <div class="campo-grupo">
          <div class="musicos-header">
            <ion-icon name="people-outline"></ion-icon>
            <span>Músicos escalados</span>
          </div>

          <div class="grid-musicos">
            <div 
              *ngFor="let musico of musicos" 
              class="item-musico" 
              [class.selecionado]="isMusicoSelecionado(musico)"
              (click)="toggleMusico(musico)"
            >
              <div class="circulo-selecao"></div>
              <span class="nome-musico">{{ musico.nome }}</span>
            </div>
          </div>
          <span *ngIf="isInvalid('musicos')" class="msg-erro">Selecione pelo menos um músico.</span>
        </div>

        <!-- Ações -->
        <div class="acoes-rodape">
          <button *ngIf="modoEdicao" type="button" class="btn-excluir" (click)="excluir()" [disabled]="isSaving">
            Excluir
          </button>

          <button type="submit" class="btn-submit" [disabled]="isSaving">
            <ion-spinner *ngIf="isSaving" name="crescent"></ion-spinner>
            <span *ngIf="!isSaving">+ {{ modoEdicao ? 'Atualizar ensaio' : 'Criar ensaio' }}</span>
          </button>
        </div>
      </form>
    </div>
  </div>
</ion-content>
