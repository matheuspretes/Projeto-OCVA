spring:
  application:
    name: ocva

  datasource:
    url: ${DATASOURCE_URL:jdbc:mysql://localhost:3306/bdocva}
    username: root
    password: 
    driver-class-name: ${DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}

  jpa:
    hibernate:
      ddl-auto: update # create, create-drop, validate, none, update
    show-sql: true
    properties:
      hibernate:
        format_sql: true